plugins {
   id "com.android.application"
   id "kotlin-android"
   id "dev.flutter.flutter-gradle-plugin"
   id "com.google.gms.google-services"  // Google Services plugin

}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    // Namespace only scopes the generated R class and BuildConfig; it is not
    // the Play Store identity. Kept aligned with applicationId for clarity.
    namespace "com.hemedgroup.heclinic"
    // 36 is required by androidx.core:core:1.18.0 (pulled in via connectivity_plus).
    // Raising compileSdk only allows newer APIs to be referenced at compile time;
    // runtime behaviour is still governed by targetSdk below.
    compileSdkVersion 36
    ndkVersion "28.2.13676358"

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    lintOptions {
        disable 'InvalidPackage'
        checkReleaseBuilds false
    }

    defaultConfig {
        // Play Store identity for the relaunched app.
        //
        // The previous developer account was blocked, so the old listing
        // (com.hemedgroup.heclinicapps) cannot be updated. Play treats the
        // applicationId as the permanent identity of an app, so shipping under
        // a new account requires a new one. This value can never be changed
        // again once the app is published.
        //
        // iOS is unaffected and keeps com.hemedgroup.heclinicapps, so that
        // listing continues to receive ordinary version updates.
        applicationId "com.hemedgroup.heclinic"
        minSdkVersion 23
        targetSdkVersion 35
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

   signingConfigs {
       release {
           keyAlias keystoreProperties['keyAlias']
           keyPassword keystoreProperties['keyPassword']
           storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
           storePassword keystoreProperties['storePassword']
       }
   }

    buildTypes {
        release {
            // Use the real upload key when android/key.properties exists, and
            // fall back to debug keys otherwise so `flutter run --release`
            // still works on a fresh checkout.
            //
            // Play Store WILL REJECT a debug-signed build, so a release
            // destined for upload must have key.properties present. See
            // docs/RELEASE.md.
            signingConfig keystorePropertiesFile.exists()
                    ? signingConfigs.release
                    : signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:2.1.0"
}
