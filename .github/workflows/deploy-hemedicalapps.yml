name: Deploy Laravel to hemedicalapps.com

on:
  workflow_dispatch:
  push:
    branches:
      - develop
    paths:
      - 'laravel/**'
      - '.github/workflows/deploy-hemedicalapps.yml'

concurrency:
  group: hemedicalapps-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install rsync
        run: |
          sudo apt-get update
          sudo apt-get install -y rsync

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H -p ${{ secrets.PORT }} ${{ secrets.HOST }} >> ~/.ssh/known_hosts || true

      - name: Check SSH reachability
        run: |
          python3 - <<'PY'
          import socket, os
          host = os.environ["HOST"]
          port = int(os.environ["PORT"])
          for p in (port, 22):
              try:
                  s = socket.create_connection((host, p), timeout=6)
                  s.close()
                  print(f"host:port({p}) => REACHABLE")
              except Exception as e:
                  print(f"host:port({p}) => UNREACHABLE ({e.__class__.__name__})")
          PY
        env:
          HOST: ${{ secrets.HOST }}
          PORT: ${{ secrets.PORT }}

      - name: Deploy Laravel via rsync
        run: >
          rsync -avz --delete
          --exclude '.env' --exclude '.env.*'
          --exclude 'vendor/' --exclude 'node_modules/'
          --exclude 'storage/logs/*' --exclude 'storage/framework/cache/*'
          --exclude 'storage/framework/sessions/*' --exclude 'storage/framework/views/*'
          --exclude 'bootstrap/cache/*' --exclude 'public/storage' --exclude 'public/build/'
          -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.PORT }} -o StrictHostKeyChecking=accept-new"
          laravel/
          ${{ secrets.USERNAME }}@${{ secrets.HOST }}:/home/hemedicalapps.com/heclinic-laravel/

      - name: Post-deploy Laravel commands
        run: |
          ssh -i ~/.ssh/deploy_key -p ${{ secrets.PORT }} -o StrictHostKeyChecking=accept-new \
            ${{ secrets.USERNAME }}@${{ secrets.HOST }} bash -s <<'REMOTE'
          set -e
          APP_DIR=/home/hemedicalapps.com/heclinic-laravel
          mkdir -p "$APP_DIR"
          cd "$APP_DIR"
          chown -R hemed2668:hemed2668 .
          composer install --no-dev --optimize-autoloader --no-interaction
          php artisan migrate --force --no-interaction || true
          php artisan storage:link || true
          php artisan optimize:clear
          chown -R hemed2668:hemed2668 storage bootstrap/cache public/storage || true
          REMOTE
