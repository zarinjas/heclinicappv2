# Deploy Laravel (heclinic-laravel) to hemedicalapps.com production server.
#
# Runs on a SELF-HOSTED GitHub runner installed ON the server itself
# (heclinic-deploy-runner, see docs/DEPLOYMENT.md). Deploy is done with local
# rsync + artisan commands — no SSH from GitHub needed.
#
# Why self-hosted: the hosting provider blocks GitHub-hosted (Azure) runner IPs
# on SSH intermittently, causing "Connection timed out" failures.
#
# Manual deploy: gh workflow run deploy-hemedicalapps.yml --repo zarinjas/heclinicappv2 --ref develop
# Full docs: docs/DEPLOYMENT.md

name: Deploy Laravel to hemedicalapps.com

on:
  workflow_dispatch:
  push:
    branches:
      - develop
    paths:
      - 'laravel/**'
      - '.github/workflows/deploy-hemedicalapps.yml'

concurrency:
  group: hemedicalapps-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Deploy Laravel (local)
        run: |
          SRC="$GITHUB_WORKSPACE/laravel"
          DST="/home/hemedicalapps.com/heclinic-laravel"
          mkdir -p "$DST"
          # NOTE: storage/app/public is excluded deliberately. It holds media
          # uploaded through the admin panel (onboarding videos, branding,
          # doctor photos). Those files are not in git, so without this exclude
          # `--delete` wipes them on every deploy.
          sudo rsync -a --delete \
            --exclude '.env' --exclude '.env.*' \
            --exclude 'vendor/' --exclude 'node_modules/' \
            --exclude 'storage/logs/*' --exclude 'storage/framework/cache/*' \
            --exclude 'storage/framework/sessions/*' --exclude 'storage/framework/views/*' \
            --exclude 'bootstrap/cache/*' --exclude 'public/storage' --exclude 'public/build/' \
            --exclude 'storage/app/public/' \
            "$SRC/" "$DST/"
          sudo chown -R hemed2668:hemed2668 "$DST"
          cd "$DST"
          sudo -u hemed2668 composer install --no-dev --optimize-autoloader --no-interaction
          sudo -u hemed2668 php artisan migrate --force --no-interaction || true

          # Seed the admin-editable legal pages (Privacy Policy & Terms of
          # Service). Deployed by `php artisan migrate` alone, the
          # `cms_legal_pages` table exists but stays empty on the production
          # SQLite DB, which makes /privacy-policy and /terms-of-service 404.
          sudo -u hemed2668 php artisan db:seed --class=LegalPageSeeder --force --no-interaction || true

          sudo -u hemed2668 php artisan storage:link || true

          # Ensure OneSender (WhatsApp OTP) config exists in the production .env.
          # Values come from GitHub secrets. Existing lines are updated in place;
          # missing lines are appended. Skip if secrets are not set.
          if [ -n "${{ secrets.ONESENDER_URL }}" ] && [ -n "${{ secrets.ONESENDER_KEY }}" ]; then
            sudo grep -q '^ONESENDER_URL=' "$DST/.env" \
              && sudo sed -i "s|^ONESENDER_URL=.*|ONESENDER_URL=${{ secrets.ONESENDER_URL }}|" "$DST/.env" \
              || echo "ONESENDER_URL=${{ secrets.ONESENDER_URL }}" | sudo tee -a "$DST/.env" > /dev/null
            sudo grep -q '^ONESENDER_KEY=' "$DST/.env" \
              && sudo sed -i "s|^ONESENDER_KEY=.*|ONESENDER_KEY=${{ secrets.ONESENDER_KEY }}|" "$DST/.env" \
              || echo "ONESENDER_KEY=${{ secrets.ONESENDER_KEY }}" | sudo tee -a "$DST/.env" > /dev/null
            sudo grep -q '^OTP_CHANNEL=' "$DST/.env" \
              && sudo sed -i "s|^OTP_CHANNEL=.*|OTP_CHANNEL=whatsapp|" "$DST/.env" \
              || echo "OTP_CHANNEL=whatsapp" | sudo tee -a "$DST/.env" > /dev/null
          fi

          sudo -u hemed2668 php artisan optimize:clear
          sudo chown -R hemed2668:hemed2668 storage bootstrap/cache public/storage || true
